<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — KostManager</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }

    .stat-label {
      font-size: 0.8125rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
    }

    .stat-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .section-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    .room-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .room-info-item label {
      font-size: 0.75rem;
      color: #64748b;
      display: block;
      margin-bottom: 2px;
    }

    .room-info-item span {
      font-size: 0.875rem;
      font-weight: 600;
      color: #0f172a;
    }

    .facility-chip {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      font-size: 0.6875rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px;
    }

    .progress-wrap {
      margin: 16px 0;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 6px;
    }

    .progress-bar {
      background: #e2e8f0;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-fill {
      background: #2563eb;
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-success {
      background: #dcfce7;
      color: #16a34a;
    }

    .badge-warning {
      background: #fef3c7;
      color: #d97706;
    }

    .badge-secondary {
      background: #f1f5f9;
      color: #64748b;
    }

    .badge-danger {
      background: #fee2e2;
      color: #dc2626;
    }

    .badge-info {
      background: #dbeafe;
      color: #2563eb;
    }

    .invoice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .invoice-row:last-child {
      border-bottom: none;
    }

    .notif-item {
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .notif-item:last-child {
      border-bottom: none;
    }

    .notif-msg {
      font-size: 0.8125rem;
      color: #0f172a;
    }

    .notif-time {
      font-size: 0.6875rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .announce-item {
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .announce-item:last-child {
      border-bottom: none;
    }

    .announce-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .announce-meta {
      font-size: 0.6875rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .announce-preview {
      font-size: 0.8125rem;
      color: #64748b;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }

    .empty-state svg {
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.875rem;
      color: #0f172a;
      background: #fff;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .info-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.8125rem;
      color: #92400e;
      margin-top: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }

    .complaints-box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e3a5f;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 2000;
      transform: translateY(80px);
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success {
      background: #16a34a;
    }

    .toast.error {
      background: #dc2626;
    }

    @media(max-width:900px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:500px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    <div class="main-content">

        <!-- Stats -->

            <!-- Tagihan Bulan Ini -->

            <!-- Pengumuman -->

              <div class="section-title">Pengumuman Terbaru</div>

          <!-- Right Column -->

                <a href="#" onclick="markAllRead(event)"
                  style="font-size:0.75rem;color:#2563eb;text-decoration:none;">Tandai semua dibaca</a>

        </div>

  <!-- Perpanjangan Modal -->
  <div class="modal-overlay" id="extModal">
    <div class="modal-box">
      <div class="modal-title">Ajukan Perpanjangan Sewa</div>
      <div class="form-group">
        <label>Tambahan Durasi</label>
        <select class="form-control" id="extDuration" onchange="updateExtDate()">
          <option value="3">3 Bulan</option>
          <option value="6">6 Bulan</option>
          <option value="12">12 Bulan</option>
        </select>
      </div>
      <div class="info-box" id="extDateInfo"></div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeExtModal()">Batal</button>
        <button class="btn btn-primary" onclick="submitExtension()">Ajukan</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const currentUser = KostAuth.requireAuth('user');

    function initLayout() {
      if (!currentUser) return;
      const initials = currentUser.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
      document.getElementById('sidebarUser').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;">
      <div style="width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;">${initials}</div>
      <div>
        <div style="font-size:0.8125rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;">${currentUser.name}</div>
        <div style="font-size:0.6875rem;color:rgba(255,255,255,0.6);">Penyewa</div>
      </div>
    </div>
    <div style="border-top:1px solid rgba(255,255,255,0.1);padding:8px 12px;">
      <a href="profile.html" style="display:block;padding:6px 8px;font-size:0.8125rem;color:rgba(255,255,255,0.75);text-decoration:none;border-radius:4px;">Profil Saya</a>
      <button onclick="KostAuth.logout()" style="display:block;width:100%;text-align:left;padding:6px 8px;font-size:0.8125rem;color:rgba(255,255,255,0.75);background:none;border:none;cursor:pointer;border-radius:4px;">Keluar</button>
    </div>`;
      document.getElementById('topbarUser').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:32px;height:32px;background:#1e3a5f;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;">${initials}</div>
        <div>
          <div style="font-size:0.8125rem;font-weight:600;color:#0f172a;">${currentUser.name}</div>
          <div style="font-size:0.6875rem;color:#64748b;">Penyewa</div>
        </div>
      </div>
      <button onclick="KostAuth.logout(true)" class="btn btn-xs btn-secondary" style="border-color:#fca5a5; color:#dc2626; cursor:pointer;" title="Keluar dari akun">Keluar</button>
    </div>`;
      const notifs = KostDB.getNotificationsByUserId(currentUser.id).filter(n => !n.read);
      if (notifs.length > 0) {
        const badge = document.getElementById('notifBadge');
        badge.textContent = notifs.length;
        badge.style.display = 'flex';
      }
      const panel = document.getElementById('notifPanel');
      const allNotifs = KostDB.getNotificationsByUserId(currentUser.id).slice(0, 5);
      panel.innerHTML = `<div style="padding:12px 16px;border-bottom:1px solid #e2e8f0;font-size:0.8125rem;font-weight:600;color:#0f172a;">Notifikasi</div>` +
        (allNotifs.length ? allNotifs.map(n => `
      <div style="padding:12px 16px;border-bottom:1px solid #f1f5f9;${!n.read ? 'background:#eff6ff' : ''}" onclick="KostDB.markNotificationRead('${n.id}');this.style.background='';document.getElementById('notifBadge').style.display='none';">
        <div style="font-size:0.8125rem;color:#0f172a;">${n.message}</div>
        <div style="font-size:0.6875rem;color:#64748b;margin-top:3px;">${KostDB.formatDate(n.created_at)}</div>
      </div>`).join('') : '<div style="padding:16px;text-align:center;font-size:0.875rem;color:#64748b;">Tidak ada notifikasi</div>');
    }

    function toggleNotifPanel() {
      const panel = document.getElementById('notifPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.notif-wrapper')) document.getElementById('notifPanel').style.display = 'none';
    });

    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    function formatRupiah(n) {
      return 'Rp ' + Number(n).toLocaleString('id-ID');
    }

    function formatDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      return dt.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    }

    function daysRemaining(endDate) {
      const now = new Date();
      const end = new Date(endDate);
      const diff = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
      return diff;
    }

    let activeBooking = null;
    let activeRoom = null;

    function initPage() {
      const bookings = KostDB.getBookingsByUserId(currentUser.id);
      activeBooking = bookings.find(b => b.status === 'active' || b.status === 'approved');
      if (activeBooking) {
        const rooms = KostDB.getRooms();
        activeRoom = rooms.find(r => r.id === activeBooking.room_id);
      }

      renderStats();
      renderRoomCard();
      renderBillingCard();
      renderAnnouncements();
      renderNotifList();
      renderComplaintsBox();
    }

    function renderStats() {
      const pendingPayments = KostDB.getPaymentsByUserId(currentUser.id).filter(p => p.status === 'pending');
      const days = activeBooking ? daysRemaining(activeBooking.end_date) : null;
      const isActive = activeBooking && activeBooking.status === 'active';

      document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card">
      <div class="stat-icon" style="background:#eff6ff;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="stat-label">Kamar Saya</div>
      <div class="stat-value">${activeRoom ? activeRoom.number : 'Belum ada'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:${isActive ? '#dcfce7' : '#f1f5f9'};">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${isActive ? '#16a34a' : '#64748b'}" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <div class="stat-label">Status Sewa</div>
      <div class="stat-value" style="font-size:1rem;margin-top:4px;">
        ${isActive ? '<span class="badge badge-success">Aktif</span>' : '<span class="badge badge-secondary">Tidak Aktif</span>'}
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fef3c7;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div class="stat-label">Sisa Masa Sewa</div>
      <div class="stat-value" style="font-size:1.1rem;">${days !== null ? (days > 0 ? days + ' hari' : 'Berakhir') : 'Tidak ada'}</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fee2e2;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      </div>
      <div class="stat-label">Tagihan Belum Bayar</div>
      <div class="stat-value">${pendingPayments.length}</div>
    </div>`;
    }

    function renderRoomCard() {
      const el = document.getElementById('roomCard');
      if (!activeBooking || !activeRoom) {
        el.innerHTML = `
      <div class="section-title">Kamar & Sewa Saya</div>
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <p style="font-size:0.9375rem;font-weight:600;color:#374151;margin-bottom:8px;">Belum ada kamar aktif</p>
        <p style="font-size:0.875rem;color:#94a3b8;margin-bottom:16px;">Anda belum memiliki kamar aktif saat ini.</p>
        <a href="rooms.html" class="btn btn-primary">Cari Kamar</a>
      </div>`;
        return;
      }

      const start = new Date(activeBooking.start_date);
      const end = new Date(activeBooking.end_date);
      const now = new Date();
      const totalDays = (end - start) / (1000 * 60 * 60 * 24);
      const usedDays = (now - start) / (1000 * 60 * 60 * 24);
      const pct = Math.min(100, Math.max(0, Math.round((usedDays / totalDays) * 100)));
      const facilities = activeRoom.facilities || [];

      el.innerHTML = `
    <div class="section-title">Kamar & Sewa Saya</div>
    <div class="room-info-grid">
      <div class="room-info-item"><label>Nomor Kamar</label><span>${activeRoom.number}</span></div>
      <div class="room-info-item"><label>Tipe</label><span>${activeRoom.type}</span></div>
      <div class="room-info-item"><label>Lantai</label><span>${activeRoom.floor}</span></div>
      <div class="room-info-item"><label>Harga / Bulan</label><span>${formatRupiah(activeRoom.price)}</span></div>
    </div>
    <div style="margin-bottom:14px;">
      <span style="font-size:0.75rem;color:#64748b;font-weight:500;">Fasilitas: </span>
      ${facilities.map(f => `<span class="facility-chip">${f}</span>`).join('')}
    </div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Masa Sewa Berjalan</span>
        <span>${pct}% terpakai</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div style="font-size:0.75rem;color:#64748b;margin-top:6px;">${formatDate(activeBooking.start_date)} — ${formatDate(activeBooking.end_date)}</div>
    </div>
    <div class="btn-row">
    <div class="btn-row" style="flex-wrap:wrap; gap:8px;">
      <a href="room-detail.html?id=${activeRoom.id}" class="btn btn-primary" style="text-decoration:none;">Detail Kamar Saya</a>
      <button class="btn btn-outline" onclick="openExtModal()">Ajukan Perpanjangan</button>
      <a href="transactions.html" class="btn btn-secondary">Lihat Riwayat Pembayaran</a>
      <a href="transactions.html" class="btn btn-secondary" style="text-decoration:none;">Riwayat Pembayaran</a>
    </div>`;
    }

    function renderBillingCard() {
      const el = document.getElementById('billingCard');
      el.innerHTML = `<div class="section-title">Tagihan Bulan Ini</div>`;

      if (!activeBooking) {
        el.innerHTML += `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:0.875rem;">Tidak ada tagihan aktif</div>`;
        return;
      }

      const payments = KostDB.getPaymentsByUserId(currentUser.id);
      const now = new Date();
      const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

      let pendingPayment = payments.find(p => p.status === 'pending');
      let paidPayment = payments.find(p => p.status === 'success' && p.month && p.month.startsWith(thisMonth));

      if (pendingPayment) {
        const desc = pendingPayment.type === 'deposit' ? `Deposit Booking` :
          pendingPayment.type === 'monthly' ? `Sewa Bulan ${formatMonthName(pendingPayment.month)}` : 'Pembayaran';
        el.innerHTML += `
      <div class="invoice-row">
        <div>
          <div style="font-size:0.8125rem;font-weight:600;color:#0f172a;">${pendingPayment.invoice_number || '-'}</div>
          <div style="font-size:0.75rem;color:#64748b;">${desc}</div>
          <div style="font-size:0.75rem;color:#d97706;margin-top:2px;">Jatuh tempo: ${formatDate(pendingPayment.due_date)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span style="font-size:0.9375rem;font-weight:700;color:#0f172a;">${formatRupiah(pendingPayment.amount)}</span>
          <a href="payments.html" class="btn btn-primary" style="font-size:0.8125rem;padding:7px 14px;">Bayar Sekarang</a>
        </div>
      </div>`;
      } else if (paidPayment) {
        el.innerHTML += `
      <div style="display:flex;align-items:center;gap:12px;padding:16px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <div>
          <div style="font-size:0.875rem;font-weight:600;color:#166534;">Tagihan Bulan Ini Sudah Dibayar</div>
          <div style="font-size:0.75rem;color:#16a34a;">Dibayar pada ${formatDate(paidPayment.paid_at)}</div>
        </div>
      </div>`;
      } else {
        el.innerHTML += `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:0.875rem;">Tidak ada tagihan aktif untuk bulan ini</div>`;
      }
    }

    function formatMonthName(monthStr) {
      if (!monthStr) return '-';
      const [y, m] = monthStr.split('-');
      const names = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return `${names[parseInt(m)]} ${y}`;
    }

    function renderAnnouncements() {
      const el = document.getElementById('announceList');
      const all = KostDB.getAnnouncements ? KostDB.getAnnouncements() : [];
      const latest = all.slice(0, 3);
      if (!latest.length) {
        el.innerHTML = '<div style="text-align:center;padding:16px;color:#94a3b8;font-size:0.875rem;">Belum ada pengumuman</div>';
        return;
      }
      el.innerHTML = latest.map(a => `
    <div class="announce-item">
      <div class="announce-title">${a.title}</div>
      <div class="announce-meta">${formatDate(a.created_at)} &bull; Oleh ${a.author_name || 'Admin'}</div>
      <div class="announce-preview">${a.content}</div>
    </div>`).join('');
    }

    function renderNotifList() {
      const el = document.getElementById('notifList');
      const notifs = KostDB.getNotificationsByUserId(currentUser.id).slice(0, 5);
      if (!notifs.length) {
        el.innerHTML = '<div style="text-align:center;padding:16px;color:#94a3b8;font-size:0.875rem;">Tidak ada notifikasi</div>';
        return;
      }
      el.innerHTML = notifs.map(n => `
    <div class="notif-item" style="${!n.read ? '' : ''}">
      <div class="notif-msg">${n.message}</div>
      <div class="notif-time">${KostDB.formatDate(n.created_at)}</div>
    </div>`).join('');
    }

    function renderComplaintsBox() {
      const el = document.getElementById('complaintsBox');
      const all = KostDB.getComplaintsByUserId ? KostDB.getComplaintsByUserId(currentUser.id) : [];
      const open = all.filter(c => c.status === 'open' || c.status === 'in_progress');
      if (open.length > 0) {
        el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;">
        <div style="width:36px;height:36px;background:#fee2e2;border-radius:8px;display:flex;align-items:center;justify-content:center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div style="flex:1;">
          <div style="font-size:0.8125rem;font-weight:600;color:#0f172a;">${open.length} keluhan menunggu respons</div>
          <a href="complaints.html" style="font-size:0.75rem;color:#2563eb;text-decoration:none;">Lihat detail →</a>
        </div>
      </div>`;
      } else {
        el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;">
        <div style="width:36px;height:36px;background:#dcfce7;border-radius:8px;display:flex;align-items:center;justify-content:center;">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div style="font-size:0.8125rem;color:#166534;font-weight:500;">Tidak ada keluhan aktif</div>
      </div>`;
      }
    }

    function markAllRead(e) {
      e.preventDefault();
      const notifs = KostDB.getNotificationsByUserId(currentUser.id);
      notifs.forEach(n => KostDB.markNotificationRead(n.id));
      document.getElementById('notifBadge').style.display = 'none';
      renderNotifList();
      showToast('Semua notifikasi ditandai dibaca', 'success');
    }

    // Perpanjangan Modal
    function openExtModal() {
      if (!activeBooking) return;
      document.getElementById('extModal').classList.add('active');
      updateExtDate();
    }
    function closeExtModal() {
      document.getElementById('extModal').classList.remove('active');
    }
    function updateExtDate() {
      if (!activeBooking) return;
      const dur = parseInt(document.getElementById('extDuration').value);
      const end = new Date(activeBooking.end_date);
      end.setMonth(end.getMonth() + dur);
      document.getElementById('extDateInfo').innerHTML = `Tanggal berakhir baru: <strong>${formatDate(end.toISOString())}</strong>`;
    }
    function submitExtension() {
      if (!activeBooking) return;
      const dur = parseInt(document.getElementById('extDuration').value);
      KostDB.createNotification({
        user_id: 'admin',
        message: `Permohonan perpanjangan sewa ${dur} bulan dari ${currentUser.name} (Kamar ${activeRoom ? activeRoom.number : ''})`,
        type: 'info',
        read: false
      });
      closeExtModal();
      showToast('Permohonan perpanjangan berhasil diajukan!', 'success');
    }

    initLayout();
    initPage();
  </script>
</body>

</html>
