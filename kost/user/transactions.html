<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Transaksi — KostManager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <style>
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.8125rem;
      min-width: 220px;
    }

    .filter-select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.8125rem;
      background: #fff;
    }

    .table-container {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .data-table th {
      background: #f8fafc;
      padding: 12px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid #e2e8f0;
    }

    .data-table td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: #0f172a;
      vertical-align: middle;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <div class="dashboard-layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a href="../index.html" style="text-decoration:none"><span class="logo-text">KostManager</span></a>
        <span class="logo-sub">Penyewa</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-section-label">Menu</span>
          <a href="dashboard.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
            Dashboard
          </a>
          <a href="rooms.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Cari Kamar
          </a>
          <a href="bookings.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            Booking Saya
          </a>
          <a href="payments.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
              <line x1="1" y1="10" x2="23" y2="10" />
            </svg>
            Pembayaran
          </a>
          <a href="transactions.html" class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            Riwayat Transaksi
          </a>
          <a href="lease.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
            </svg>
            Masa Sewa
          </a>
          <a href="complaints.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            Keluhan
          </a>
          <a href="profile.html" class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            Profil
          </a>
          <a href="javascript:void(0)" onclick="KostAuth.logout(true)" class="nav-item nav-item-logout">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Keluar dari Akun
          </a>
        </div>
      </nav>
      <div class="sidebar-user" id="sidebarUser"></div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle"
            onclick="document.getElementById('sidebar').classList.toggle('collapsed');document.getElementById('layout').classList.toggle('sidebar-collapsed')">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div>
            <h1 class="page-title">Riwayat Transaksi</h1>
            <p class="page-breadcrumb">KostManager / Penyewa / <span>Riwayat Transaksi</span></p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="topbar-user" id="topbarUser"></div>
        </div>
      </header>

      <main class="content-area">
        <div class="filter-bar">
          <div class="filter-group">
            <input type="text" id="searchInput" class="search-input" placeholder="Cari No. Transaksi atau Kamar..."
              oninput="filterTransactions()">
            <select id="statusFilter" class="filter-select" onchange="filterTransactions()">
              <option value="">Semua Status</option>
              <option value="success">Berhasil</option>
              <option value="pending">Menunggu</option>
              <option value="failed">Gagal</option>
              <option value="cancelled">Dibatalkan</option>
            </select>
          </div>
          <div>
            <button class="btn btn-secondary" onclick="exportData()"
              style="display:inline-flex; align-items:center; gap:6px;">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Export Excel / CSV
            </button>
          </div>
        </div>

        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>No. Transaksi</th>
                <th>Tanggal</th>
                <th>Kamar</th>
                <th>Metode</th>
                <th>Jumlah</th>
                <th>Status</th>
                <th style="text-align:right;">Aksi</th>
              </tr>
            </thead>
            <tbody id="transactionTbody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    const currentUser = KostAuth.guard('user');
    if (currentUser) {
      document.getElementById('topbarUser').innerHTML = `
      <div style="text-align:right; margin-right:8px;">
        <div style="font-size:0.875rem; font-weight:600; color:#0f172a;">${KostUtils.escapeHtml(currentUser.name)}</div>
        <div style="font-size:0.75rem; color:#64748b;">Penyewa</div>
      </div>
      <button onclick="KostAuth.logout(true)" class="btn btn-xs btn-secondary" style="margin-left:8px;">Keluar</button>
    `;
      document.getElementById('sidebarUser').innerHTML = `
      <div style="padding:14px; border-top:1px solid #1e293b; font-size:0.8125rem; color:#94a3b8;">
        Login sebagai: <strong style="color:#fff; display:block;">${KostUtils.escapeHtml(currentUser.name)}</strong>
      </div>
    `;
    }

    let allTransactions = [];

    function loadTransactions() {
      allTransactions = KostDB.getPaymentsByUserId(currentUser.id);
      allTransactions.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
      filterTransactions();
    }

    function filterTransactions() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase();
      const st = document.getElementById('statusFilter').value;

      const filtered = allTransactions.filter(t => {
        const matchQ = (t.id && t.id.toLowerCase().includes(q)) || (t.room_number && t.room_number.toLowerCase().includes(q));
        const matchSt = !st || t.status === st;
        return matchQ && matchSt;
      });

      const tbody = document.getElementById('transactionTbody');
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:32px; color:#94a3b8;">Tidak ada catatan transaksi ditemukan.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(t => `
      <tr>
        <td><strong style="color:#1e3a5f;">${t.id}</strong></td>
        <td>${KostUtils.formatDate(t.paid_at || t.created_at, true)}</td>
        <td>Kamar ${t.room_number || '-'}</td>
        <td><span style="font-size:0.8125rem; background:#f1f5f9; padding:2px 8px; border-radius:4px; font-weight:500;">${(t.method || 'Online').toUpperCase()}</span></td>
        <td><strong style="color:#0f172a;">${KostUtils.formatRupiah(t.amount)}</strong></td>
        <td>${KostUtils.getStatusBadge(t.status, 'payment')}</td>
        <td style="text-align:right;">
          ${t.status === 'success' ? `
            <a href="../payment/status.html?trx_id=${t.id}&status=success" class="btn btn-xs btn-secondary" style="text-decoration:none;">Kwitansi</a>
          ` : (t.status === 'pending' || t.status === 'failed' || t.status === 'cancelled' ? `
            <a href="../payment/checkout.html?payment_id=${t.id}" class="btn btn-xs btn-primary" style="text-decoration:none;">Bayar Ulang</a>
          ` : `
            <span style="font-size:0.75rem; color:#94a3b8;">-</span>
          `)}
        </td>
      </tr>
    `).join('');
    }

    function exportData() {
      const headers = ['No Transaksi', 'Tanggal', 'Kamar', 'Metode', 'Jumlah', 'Status'];
      const rows = allTransactions.map(t => [
        t.id,
        t.paid_at || t.created_at,
        t.room_number || '',
        t.method || '',
        t.amount,
        t.status
      ]);
      KostUtils.exportToCSV('riwayat_transaksi_' + currentUser.name.replace(/\s+/g, '_') + '.csv', [headers, ...rows]);
    }

    loadTransactions();
  </script>
</body>

</html>
